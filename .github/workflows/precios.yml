name: Precios al cierre

on:
  schedule:
    # Cada día a las 22:30 UTC, después del cierre de Europa y EE. UU. (cripto cotiza también en fin de semana)
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/precios.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
